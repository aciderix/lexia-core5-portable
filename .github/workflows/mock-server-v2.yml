name: Mock Server Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Lexia installer
        id: cache-installer
        uses: actions/cache@v4
        with:
          path: lexia-installer.exe
          key: lexia-installer-v1.0

      - name: Download Lexia Core5 installer from release
        if: steps.cache-installer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $apiUrl = "https://api.github.com/repos/aciderix/lexia-core5-portable/releases/assets/508863891"
          $headers = @{ "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}"; "Accept" = "application/octet-stream" }
          Invoke-WebRequest -Uri $apiUrl -OutFile "lexia-installer.exe" -Headers $headers

      - name: Check if already installed
        id: check-install
        shell: pwsh
        run: if (Test-Path "C:\Program Files (x86)\Lexia Core5\LexiaCore5.exe") { echo "installed=true" >> $env:GITHUB_OUTPUT } else { echo "installed=false" >> $env:GITHUB_OUTPUT }

      - name: Install Lexia Core5 silently
        if: steps.check-install.outputs.installed != 'true'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\lexia-installer.exe" -ArgumentList "--mode","unattended","--unattendedmodeui","none" -Wait -PassThru
          Write-Host "Installer exit code: $($proc.ExitCode)"
          Start-Sleep -Seconds 15

      - name: Download patched SWF and remove signatures
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/aciderix/lexia-core5-portable/releases/download/v1.0/PortalDesktop-patched.swf" -OutFile "PortalDesktop-patched.swf"
          Copy-Item "PortalDesktop-patched.swf" "C:\Program Files (x86)\Lexia Core5\PortalDesktop.swf" -Force
          
          # Remove AIR signature files so the patched SWF passes validation
          $metaDir = "C:\Program Files (x86)\Lexia Core5\META-INF"
          Remove-Item "$metaDir\signatures.xml" -Force -ErrorAction SilentlyContinue
          Remove-Item "$metaDir\AIR\hash" -Force -ErrorAction SilentlyContinue
          Write-Host "Removed signatures.xml and hash"
          
          # Show what's left in META-INF
          Get-ChildItem $metaDir -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          
          Copy-Item "scripts/amf_server.py" "C:\amf_server.py"
          Write-Host "Setup complete"

      - name: Run app with screenshots and AMF server
        shell: pwsh
        run: |
          $code = '
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path "screenshots" | Out-Null

          # Start AMF server
          Write-Host "Starting AMF server..."
          $serverJob = Start-Job -ScriptBlock { python C:\amf_server.py 2>&1 | Out-File C:\amf-stdout.txt -Encoding UTF8 }
          Start-Sleep -Seconds 5
          netstat -an | Select-String "8080"

          # Win32 API
          $fg = Add-Type -MemberDefinition "[DllImport(`"user32.dll`")] public static extern bool SetForegroundWindow(IntPtr h);" -Name FG -Namespace W -PassThru
          $sw = Add-Type -MemberDefinition "[DllImport(`"user32.dll`")] public static extern bool ShowWindow(IntPtr h, int n);" -Name SW -Namespace W -PassThru
          $me = Add-Type -MemberDefinition "[DllImport(`"user32.dll`")] public static extern void mouse_event(uint f, uint x, uint y, uint c, uint i);" -Name ME -Namespace W -PassThru

          # Launch app
          Write-Host "Launching LexiaCore5..."
          $exe = "C:\Program Files (x86)\Lexia Core5\LexiaCore5.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host "App PID: $($proc.Id)"
          Start-Sleep -Seconds 15

          # Check process
          $p = Get-Process -Name "LexiaCore5" -ErrorAction SilentlyContinue
          if (-not $p) {
            Write-Host "PROCESS DIED! Exit code: $($proc.ExitCode), HasExited: $($proc.HasExited)"
            
            # Also try CaptiveAppEntry
            Write-Host "Trying CaptiveAppEntry..."
            $captive = "C:\Program Files (x86)\Lexia Core5\Adobe AIR\Versions\1.0\Resources\CaptiveAppEntry.exe"
            if (Test-Path $captive) {
              $proc2 = Start-Process -FilePath $captive -PassThru
              Write-Host "CaptiveAppEntry PID: $($proc2.Id)"
              Start-Sleep -Seconds 10
              $p2 = Get-Process -Id $proc2.Id -ErrorAction SilentlyContinue
              if ($p2) {
                Write-Host "CaptiveAppEntry alive. MainWindowHandle: $($p2.MainWindowHandle)"
                Write-Host "MainWindowTitle: $($p2.MainWindowTitle)"
                $p = $p2
              }
            }
          } else {
            Write-Host "Process alive. MainWindowHandle: $($p.MainWindowHandle)"
            Write-Host "MainWindowTitle: $($p.MainWindowTitle)"
            
            if ($p.MainWindowHandle -ne 0) {
              $sw::ShowWindow($p.MainWindowHandle, 3) | Out-Null
              Start-Sleep -Milliseconds 500
              $fg::SetForegroundWindow($p.MainWindowHandle) | Out-Null
              Start-Sleep -Seconds 5
            }
          }

          # Screenshot
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          $bounds = $screen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("screenshots\01-initial.png")
          $g.Dispose(); $bmp.Dispose()
          Write-Host "Initial screenshot saved"

          # Interact if window exists
          if ($p -and $p.MainWindowHandle -ne 0) {
            Write-Host "Interacting..."
            [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point(512, 300)
            Start-Sleep -Milliseconds 300
            $me::mouse_event(0x02, 0, 0, 0, 0)
            Start-Sleep -Milliseconds 100
            $me::mouse_event(0x04, 0, 0, 0, 0)
            Start-Sleep -Milliseconds 500
            [System.Windows.Forms.SendKeys]::SendWait("12345")
            Start-Sleep -Milliseconds 500
            [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
            Start-Sleep -Seconds 5
            
            $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save("screenshots\02-after-input.png")
            $g.Dispose(); $bmp.Dispose()
            Write-Host "After input screenshot saved"
          }

          # More screenshots
          for ($i = 3; $i -le 5; $i++) {
            Start-Sleep -Seconds 5
            $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save("screenshots\0$i-delayed.png")
            $g.Dispose(); $bmp.Dispose()
            Write-Host "Screenshot $i saved"
          }

          # Results
          Write-Host "=== AMF Server stdout ==="
          if (Test-Path C:\amf-stdout.txt) { Get-Content C:\amf-stdout.txt }
          Write-Host "=== AMF Log ==="
          if (Test-Path C:\amf-log.txt) { Get-Content C:\amf-log.txt } else { Write-Host "No AMF log" }
          Write-Host "=== Processes ==="
          Get-Process -Name "python","LexiaCore5","CaptiveAppEntry" -ErrorAction SilentlyContinue | Format-Table Name,Id,MainWindowTitle -AutoSize

          Get-Process -Name "LexiaCore5","CaptiveAppEntry" -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Job $serverJob -ErrorAction SilentlyContinue
          Remove-Job $serverJob -ErrorAction SilentlyContinue
          '
          
          $code | Out-File -FilePath "C:\interact.ps1" -Encoding UTF8
          & "C:\interact.ps1"

      - name: Upload AMF logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amf-logs
          path: |
            C:\amf-log.txt
            C:\amf-stdout.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-test-screenshots
          path: screenshots/
          retention-days: 30
          if-no-files-found: ignore
