name: Mock Server Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Lexia installer
        id: cache-installer
        uses: actions/cache@v4
        with:
          path: lexia-installer.exe
          key: lexia-installer-v1.0

      - name: Download Lexia Core5 installer from release
        if: steps.cache-installer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $apiUrl = "https://api.github.com/repos/aciderix/lexia-core5-portable/releases/assets/508863891"
          $headers = @{ "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}"; "Accept" = "application/octet-stream" }
          Invoke-WebRequest -Uri $apiUrl -OutFile "lexia-installer.exe" -Headers $headers

      - name: Check if already installed
        id: check-install
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\Lexia Core5\LexiaCore5.exe") { echo "installed=true" >> $env:GITHUB_OUTPUT } else { echo "installed=false" >> $env:GITHUB_OUTPUT }

      - name: Install Lexia Core5 silently
        if: steps.check-install.outputs.installed != 'true'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\lexia-installer.exe" -ArgumentList "--mode","unattended","--unattendedmodeui","none" -Wait -PassThru
          Write-Host "Installer exit code: $($proc.ExitCode)"
          Start-Sleep -Seconds 15

      - name: List all files in install directory
        shell: pwsh
        run: Get-ChildItem "C:\Program Files (x86)\Lexia Core5" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Download patched SWF
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/aciderix/lexia-core5-portable/releases/download/v1.0/PortalDesktop-patched.swf" -OutFile "PortalDesktop-patched.swf"
          Write-Host "Downloaded patched SWF"

      - name: Replace SWF with patched version
        shell: pwsh
        run: |
          Copy-Item "PortalDesktop-patched.swf" "C:\Program Files (x86)\Lexia Core5\PortalDesktop.swf" -Force
          Write-Host "Replaced SWF with patched version (HTTP localhost:8080)"

      - name: Copy AMF server script
        shell: pwsh
        run: |
          Copy-Item "scripts/amf_server.py" "C:\amf_server.py"
          Write-Host "AMF server script copied"

      - name: Start mock AMF server (HTTP port 8080)
        shell: pwsh
        run: |
          Start-Process -FilePath "python" -ArgumentList "C:\amf_server.py" -PassThru -NoNewWindow -RedirectStandardOutput "C:\amf-stdout.txt" -RedirectStandardError "C:\amf-stderr.txt"
          Start-Sleep -Seconds 5
          Write-Host "=== Server stdout ==="
          if (Test-Path C:\amf-stdout.txt) { Get-Content C:\amf-stdout.txt }
          Write-Host "=== netstat ==="
          netstat -an | findstr "8080"

      - name: Create UI automation script
        shell: pwsh
        run: |
          $script = @'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          
          $sig = '[DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd); [DllImport("user32.dll")] public static extern void mouse_event(uint dwFlags, uint dx, uint dy, uint cButtons, uint dwExtraInfo);'
          $win = Add-Type -MemberDefinition $sig -Name Win32 -Namespace API -PassThru
          
          $proc = Get-Process -Name "LexiaCore5" -ErrorAction SilentlyContinue
          if ($proc) {
            $win::SetForegroundWindow($proc.MainWindowHandle)
            Start-Sleep -Milliseconds 500
          }
          
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point(512, 384)
          Start-Sleep -Milliseconds 300
          $win::mouse_event(0x02, 0, 0, 0, 0)
          Start-Sleep -Milliseconds 100
          $win::mouse_event(0x04, 0, 0, 0, 0)
          Start-Sleep -Milliseconds 500
          
          [System.Windows.Forms.SendKeys]::SendWait("12345")
          Start-Sleep -Milliseconds 500
          [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          Start-Sleep -Seconds 10
          
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          $bounds = $screen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $graphics = [System.Drawing.Graphics]::FromImage($bmp)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          New-Item -ItemType Directory -Force -Path "screenshots" | Out-Null
          $bmp.Save("screenshots\02-after-interaction.png")
          $graphics.Dispose(); $bmp.Dispose()
          Write-Host "Interaction screenshot saved"
          '@
          
          $script | Out-File -FilePath "C:\ui_automation.ps1" -Encoding UTF8
          Write-Host "UI automation script created"

      - name: Launch app and take initial screenshot
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $exe = "C:\Program Files (x86)\Lexia Core5\LexiaCore5.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host "Launched app PID: $($proc.Id)"
          Start-Sleep -Seconds 15
          
          New-Item -ItemType Directory -Force -Path "screenshots" | Out-Null
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          $bounds = $screen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $graphics = [System.Drawing.Graphics]::FromImage($bmp)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("screenshots\01-initial.png")
          $graphics.Dispose(); $bmp.Dispose()
          Write-Host "Initial screenshot saved"

      - name: Run UI automation (click + type + enter)
        shell: pwsh
        run: |
          & "C:\ui_automation.ps1"

      - name: Take final screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          $bounds = $screen.Bounds
          for ($i = 3; $i -le 5; $i++) {
            $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bmp)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save("screenshots\0$i-final.png")
            $graphics.Dispose(); $bmp.Dispose()
            Write-Host "Screenshot $i saved"
            Start-Sleep -Seconds 5
          }

      - name: Check AMF server and network
        shell: pwsh
        run: |
          Write-Host "=== AMF Server stdout ==="
          if (Test-Path C:\amf-stdout.txt) { Get-Content C:\amf-stdout.txt }
          Write-Host "=== AMF Log ==="
          if (Test-Path C:\amf-log.txt) { Get-Content C:\amf-log.txt } else { Write-Host "No AMF log (no requests received)" }
          Write-Host "=== netstat ==="
          netstat -an | findstr "8080"
          Write-Host "=== Processes ==="
          Get-Process -Name "python","LexiaCore5" -ErrorAction SilentlyContinue | Format-Table Name,Id,MainWindowTitle -AutoSize

      - name: Stop processes
        shell: pwsh
        run: |
          Get-Process -Name "LexiaCore5" -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process -Name "python" -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Upload AMF logs
        uses: actions/upload-artifact@v4
        with:
          name: amf-logs
          path: |
            C:\amf-log.txt
            C:\amf-stdout.txt
            C:\amf-stderr.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mock-test-screenshots
          path: screenshots/
          retention-days: 30
          if-no-files-found: ignore
