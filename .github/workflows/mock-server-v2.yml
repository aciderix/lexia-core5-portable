name: Mock Server Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Lexia installer
        id: cache-installer
        uses: actions/cache@v4
        with:
          path: lexia-installer.exe
          key: lexia-installer-v1.0

      - name: Download Lexia Core5 installer from release
        if: steps.cache-installer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $apiUrl = "https://api.github.com/repos/aciderix/lexia-core5-portable/releases/assets/508863891"
          $headers = @{ "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}"; "Accept" = "application/octet-stream" }
          Invoke-WebRequest -Uri $apiUrl -OutFile "lexia-installer.exe" -Headers $headers

      - name: Check if already installed
        id: check-install
        shell: pwsh
        run: if (Test-Path "C:\Program Files (x86)\Lexia Core5\LexiaCore5.exe") { echo "installed=true" >> $env:GITHUB_OUTPUT } else { echo "installed=false" >> $env:GITHUB_OUTPUT }

      - name: Install Lexia Core5 silently
        if: steps.check-install.outputs.installed != 'true'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\lexia-installer.exe" -ArgumentList "--mode","unattended","--unattendedmodeui","none" -Wait -PassThru
          Write-Host "Installer exit code: $($proc.ExitCode)"
          Start-Sleep -Seconds 15

      - name: Download patched SWF and replace
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/aciderix/lexia-core5-portable/releases/download/v1.0/PortalDesktop-patched.swf" -OutFile "PortalDesktop-patched.swf"
          Copy-Item "PortalDesktop-patched.swf" "C:\Program Files (x86)\Lexia Core5\PortalDesktop.swf" -Force
          Copy-Item "scripts/amf_server.py" "C:\amf_server.py"
          Write-Host "Files replaced"

      - name: ALL IN ONE - Server + App + Window + Interact + Screenshot
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path "screenshots" | Out-Null

          # --- Start mock AMF server ---
          Write-Host "Starting AMF server..."
          $serverJob = Start-Job -ScriptBlock {
            python C:\amf_server.py 2>&1 | Out-File C:\amf-stdout.txt -Encoding UTF8
          }
          Start-Sleep -Seconds 5
          Write-Host "=== netstat ==="
          netstat -an | Select-String "8080"

          # --- Win32 API helpers ---
          $sig = @'
          [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
          [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint c, uint i);
          [DllImport("user32.dll")] public static extern IntPtr FindWindow(string c, string w);
          [DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc p, IntPtr l);
          [DllImport("user32.dll")] public static extern int GetWindowText(IntPtr h, System.Text.StringBuilder s, int n);
          [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
          public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);
'@
          $win = Add-Type -MemberDefinition $sig -Name W -Namespace U -PassThru

          # --- Launch app ---
          Write-Host "Launching LexiaCore5..."
          $exe = "C:\Program Files (x86)\Lexia Core5\LexiaCore5.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host "App PID: $($proc.Id)"
          Start-Sleep -Seconds 10

          # --- Check app window ---
          Write-Host "=== App window info ==="
          $proc2 = Get-Process -Name "LexiaCore5" -ErrorAction SilentlyContinue
          if ($proc2) {
            Write-Host "MainWindowHandle: $($proc2.MainWindowHandle)"
            Write-Host "MainWindowTitle: '$($proc2.MainWindowTitle)'"
            
            if ($proc2.MainWindowHandle -eq 0 -or $proc2.MainWindowTitle -eq "") {
              Write-Host "No main window! Trying to find AIR windows..."
              # Find all visible windows
              $sb = New-Object System.Text.StringBuilder 256
              $windows = [System.Collections.ArrayList]::new()
              $enumProc = [U.W+EnumWindowsProc]{
                param($hWnd, $lParam)
                if ([U.W]::IsWindowVisible($hWnd)) {
                  $title = New-Object System.Text.StringBuilder 256
                  [U.W]::GetWindowText($hWnd, $title, 256) | Out-Null
                  $t = $title.ToString()
                  if ($t) { $windows.Add("$hWnd | $t") | Out-Null }
                }
                return $true
              }
              [U.W]::EnumWindows($enumProc, [IntPtr]::Zero) | Out-Null
              Write-Host "=== Visible windows ==="
              $windows | ForEach-Object { Write-Host "  $_" }
            }
            
            # Try to maximize and bring to front
            Write-Host "Maximizing app window..."
            [U.W]::ShowWindow($proc2.MainWindowHandle, 3) | Out-Null  # SW_MAXIMIZE
            Start-Sleep -Milliseconds 500
            [U.W]::SetForegroundWindow($proc2.MainWindowHandle) | Out-Null
            Start-Sleep -Seconds 5
          } else {
            Write-Host "LexiaCore5 process not found!"
          }

          # Minimize all other windows using keyboard shortcut
          [System.Windows.Forms.SendKeys]::SendWait("{ESC}")
          Start-Sleep -Milliseconds 500

          # --- Take initial screenshot ---
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          $bounds = $screen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("screenshots\01-initial.png")
          $g.Dispose(); $bmp.Dispose()
          Write-Host "Initial screenshot saved"

          # --- Interact ---
          Write-Host "Interacting with app..."
          # Click on upper-center area where site ID input likely is
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point(512, 300)
          Start-Sleep -Milliseconds 300
          [U.W]::mouse_event(0x02, 0, 0, 0, 0)
          Start-Sleep -Milliseconds 100
          [U.W]::mouse_event(0x04, 0, 0, 0, 0)
          Start-Sleep -Milliseconds 500
          
          # Type site ID
          [System.Windows.Forms.SendKeys]::SendWait("12345")
          Start-Sleep -Milliseconds 500
          
          # Tab to the connect button and press Enter
          [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          Start-Sleep -Seconds 5

          # Screenshot after first interaction
          $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("screenshots\02-after-input.png")
          $g.Dispose(); $bmp.Dispose()
          Write-Host "After input screenshot saved"

          # Try clicking at different positions (lower-center for button)
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point(512, 500)
          Start-Sleep -Milliseconds 300
          [U.W]::mouse_event(0x02, 0, 0, 0, 0)
          Start-Sleep -Milliseconds 100
          [U.W]::mouse_event(0x04, 0, 0, 0, 0)
          Start-Sleep -Seconds 5

          # Screenshot after button click
          $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("screenshots\03-after-click.png")
          $g.Dispose(); $bmp.Dispose()
          Write-Host "After click screenshot saved"

          # More screenshots
          for ($i = 4; $i -le 6; $i++) {
            Start-Sleep -Seconds 5
            $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save("screenshots\0$i-delayed.png")
            $g.Dispose(); $bmp.Dispose()
            Write-Host "Screenshot $i saved"
          }

          # --- Check results ---
          Write-Host "=== AMF Server stdout ==="
          if (Test-Path C:\amf-stdout.txt) { Get-Content C:\amf-stdout.txt }
          Write-Host "=== AMF Log ==="
          if (Test-Path C:\amf-log.txt) { Get-Content C:\amf-log.txt } else { Write-Host "No AMF log (no requests received)" }
          Write-Host "=== netstat ==="
          netstat -an | Select-String "8080"
          Write-Host "=== Processes ==="
          Get-Process -Name "python","LexiaCore5" -ErrorAction SilentlyContinue | Format-Table Name,Id,MainWindowTitle -AutoSize

          # Cleanup
          Get-Process -Name "LexiaCore5" -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Job $serverJob -ErrorAction SilentlyContinue
          Remove-Job $serverJob -ErrorAction SilentlyContinue

      - name: Upload AMF logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amf-logs
          path: |
            C:\amf-log.txt
            C:\amf-stdout.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-test-screenshots
          path: screenshots/
          retention-days: 30
          if-no-files-found: ignore
