name: Mock Server Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Lexia installer
        id: cache-installer
        uses: actions/cache@v4
        with:
          path: lexia-installer.exe
          key: lexia-installer-v1.0

      - name: Download Lexia Core5 installer from release
        if: steps.cache-installer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $apiUrl = "https://api.github.com/repos/aciderix/lexia-core5-portable/releases/assets/508863891"
          $headers = @{ "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}"; "Accept" = "application/octet-stream" }
          Invoke-WebRequest -Uri $apiUrl -OutFile "lexia-installer.exe" -Headers $headers

      - name: Check if already installed
        id: check-install
        shell: pwsh
        run: if (Test-Path "C:\Program Files (x86)\Lexia Core5\LexiaCore5.exe") { echo "installed=true" >> $env:GITHUB_OUTPUT } else { echo "installed=false" >> $env:GITHUB_OUTPUT }

      - name: Install Lexia Core5 silently
        if: steps.check-install.outputs.installed != 'true'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\lexia-installer.exe" -ArgumentList "--mode","unattended","--unattendedmodeui","none" -Wait -PassThru
          Write-Host "Installer exit code: $($proc.ExitCode)"
          Start-Sleep -Seconds 15

      - name: Setup PHP and AMFPHP
        shell: pwsh
        run: |
          $php = Get-Command php -ErrorAction SilentlyContinue
          if ($php) {
            Write-Host "PHP already available: $($php.Source)"
            $phpVersion = & php -v 2>&1 | Select-Object -First 1
            Write-Host "PHP version: $phpVersion"
          } else {
            Write-Host "Installing PHP via chocolatey..."
            choco install php --no-progress -y
            $php = Get-Command php -ErrorAction SilentlyContinue
            if (-not $php) { Write-Host "ERROR: PHP installation failed!"; exit 1 }
          }
          
          Write-Host "Downloading AMFPHP 2.x..."
          Invoke-WebRequest -Uri "https://github.com/silexlabs/amfphp-2.0/archive/refs/heads/master.zip" -OutFile "amfphp.zip"
          Expand-Archive -Path "amfphp.zip" -DestinationPath "C:\amfphp-src" -Force
          
          $amfphpDir = Get-ChildItem -Path "C:\amfphp-src" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "C:\amfphp" | Out-Null
          Copy-Item -Path "$($amfphpDir.FullName)\*" -Destination "C:\amfphp" -Recurse -Force
          
          Copy-Item "scripts/AMFClient.php" -Destination "C:\amfphp\Amfphp\Services\AMFClient.php" -Force
          Write-Host "AMFClient.php copied"
          
          $indexFile = "C:\amfphp\Amfphp\index.php"
          if (Test-Path $indexFile) {
            Write-Host "Gateway found at: $indexFile"
          } else {
            Write-Host "ERROR: No index.php found!"
            exit 1
          }
          
          Write-Host "=== Patching AMFPHP for PHP 8.x compat ==="
          $errorHandlerFile = "C:\amfphp\Amfphp\Plugins\AmfphpErrorHandler\AmfphpErrorHandler.php"
          if (Test-Path $errorHandlerFile) {
            $ehContent = Get-Content $errorHandlerFile -Raw
            $ehContent = $ehContent -replace 'function custom_warning_handler\((\$\w+),\s*(\$\w+),\s*(\$\w+),\s*(\$\w+),\s*(\$\w+)\)', 'function custom_warning_handler($1, $2, $3, $4, $5 = null)'
            Set-Content $errorHandlerFile -Value $ehContent -NoNewline
            Write-Host "  Patched AmfphpErrorHandler: 5th param now optional"
          }
          
          Get-ChildItem -Path "C:\amfphp\Amfphp" -Filter "*.php" -Recurse | ForEach-Object {
            $fcontent = Get-Content $_.FullName -Raw
            $modified = $false
            if ($fcontent -match '\beach\s*\(') {
              $fcontent = $fcontent -replace 'while\(\s*each\(\$(\w+)\)\s*\)\s*{', 'foreach ($$$1 as $__key => $__val) {'
              $modified = $true
            }
            if ($fcontent -match 'get_magic_quotes_gpc\s*\(') {
              $fcontent = $fcontent -replace 'get_magic_quotes_gpc\(\)', 'false'
              $modified = $true
            }
            if ($fcontent -match 'get_magic_quotes_runtime\s*\(') {
              $fcontent = $fcontent -replace 'get_magic_quotes_runtime\(\)', 'false'
              $modified = $true
            }
            if ($modified) { Set-Content $_.FullName -Value $fcontent -NoNewline }
          }
          
          Write-Host "=== Services directory ==="
          Get-ChildItem "C:\amfphp\Amfphp\Services" | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Setup hosts redirect and proxy
        shell: pwsh
        run: |
          $hostsFile = "C:\Windows\System32\drivers\etc\hosts"
          $entries = @(
            "127.0.0.1 student.mylexia.com",
            "127.0.0.1 dev10.lexialearning.com",
            "127.0.0.1 qa10.lexialearning.com",
            "127.0.0.1 www.mylexia.com",
            "127.0.0.1 mylexia.com",
            "127.0.0.1 api.lexialearning.com",
            "127.0.0.1 student.lexialearning.com"
          )
          foreach ($entry in $entries) { Add-Content -Path $hostsFile -Value $entry }
          Write-Host "Hosts file updated"
          Copy-Item "scripts/proxy.py" "C:\proxy.py" -Force
          Copy-Item "scripts/CORE5.sol" "C:\CORE5.sol" -Force
          Write-Host "Proxy and SOL file copied"

      - name: Run mock server and app
        shell: pwsh
        run: |
          $code = '
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path "screenshots" | Out-Null

          $fg = Add-Type -MemberDefinition "[DllImport(`"user32.dll`")] public static extern bool SetForegroundWindow(IntPtr h);" -Name FG -Namespace W -PassThru
          $sw = Add-Type -MemberDefinition "[DllImport(`"user32.dll`")] public static extern bool ShowWindow(IntPtr h, int n);" -Name SW -Namespace W -PassThru
          $me = Add-Type -MemberDefinition "[DllImport(`"user32.dll`")] public static extern void mouse_event(uint f, uint x, uint y, uint c, uint i);" -Name ME -Namespace W -PassThru
          # keybd_event for hardware-level keyboard input (more reliable than SendKeys for special keys)
          $ke = Add-Type -MemberDefinition "[DllImport(`"user32.dll`")] public static extern void keybd_event(byte bVk, byte bScan, uint dwFlags, UIntPtr dwExtraInfo);" -Name KE -Namespace W -PassThru

          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
          public class WinRect {
              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(IntPtr hWnd, out RECT lpRect);
              [DllImport("user32.dll")]
              public static extern bool SendMessage(IntPtr hWnd, uint Msg, IntPtr wParam, IntPtr lParam);
          }
          "@

          # ============================================================
          # STEP 1: Start PHP server
          # ============================================================
          Write-Host "Starting PHP server on port 8080..."
          $phpJob = Start-Job -ScriptBlock {
            php -S 127.0.0.1:8080 -t C:\amfphp 2>&1 | Out-File C:\php-stdout.txt -Encoding UTF8
          }
          Start-Sleep -Seconds 3
          
          try {
            $testResp = Invoke-WebRequest -Uri "http://127.0.0.1:8080/Amfphp/index.php" -UseBasicParsing -TimeoutSec 5
            Write-Host "PHP server OK: $($testResp.StatusCode)"
          } catch { Write-Host "PHP server test: $_" }

          # ============================================================
          # STEP 2: Start HTTPS proxy
          # ============================================================
          Write-Host "Starting HTTPS proxy on port 443..."
          $proxyJob = Start-Job -ScriptBlock { python C:\proxy.py 2>&1 | Out-File C:\proxy-stdout.txt -Encoding UTF8 }
          Start-Sleep -Seconds 5
          netstat -an | Select-String ":443 ",":8080 "

          # ============================================================
          # STEP 3: First app launch - create SharedObject directory
          # ============================================================
          Write-Host "=== First app launch (to create SharedObject dirs) ==="
          $exe = "C:\Program Files (x86)\Lexia Core5\LexiaCore5.exe"
          $proc1 = Start-Process -FilePath $exe -PassThru
          Write-Host "First launch PID: $($proc1.Id)"
          Start-Sleep -Seconds 15
          
          # Kill first instance
          Write-Host "Killing first instance..."
          Get-Process -Name "LexiaCore5" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3

          # ============================================================
          # STEP 4: Find and analyze original .sol, then place our modified one
          # ============================================================
          Write-Host "=== Searching for #SharedObjects directory ==="
          $solDir = $null
          $soDirs = Get-ChildItem -Path "$env:APPDATA","$env:LOCALAPPDATA" -Recurse -Directory -Filter "#SharedObjects" -ErrorAction SilentlyContinue
          foreach ($soDir in $soDirs) {
            Write-Host "Found #SharedObjects at: $($soDir.FullName)"
            if ($soDir.FullName -match "com\.lexiareading") {
              $solDir = $soDir.FullName
            }
          }
          
          if ($solDir) {
            Write-Host "Using Lexia SharedObject dir: $solDir"
            # List all existing .sol files
            Get-ChildItem -Path $solDir -Recurse -Filter "*.sol" | ForEach-Object {
              Write-Host "  Found: $($_.FullName) ($($_.Length) bytes)"
              # Copy original .sol to artifacts for analysis
              Copy-Item $_.FullName "screenshots\original_CORE5.sol" -Force
            }
            
            # Place our .sol in all subdirectories
            $subDirs = Get-ChildItem -Path $solDir -Directory -ErrorAction SilentlyContinue
            if ($subDirs) {
              foreach ($sub in $subDirs) {
                $solDest = Join-Path $sub.FullName "CORE5.sol"
                Copy-Item "C:\CORE5.sol" $solDest -Force
                Write-Host "  Placed CORE5.sol at: $solDest"
              }
            }
            # Also place in root
            $solDestRoot = Join-Path $solDir "CORE5.sol"
            Copy-Item "C:\CORE5.sol" $solDestRoot -Force
            Write-Host "  Placed CORE5.sol at: $solDestRoot"
          }

          # ============================================================
          # STEP 5: Second app launch
          # ============================================================
          Write-Host "=== Second app launch ==="
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host "App PID: $($proc.Id)"
          Start-Sleep -Seconds 25
          
          $p = Get-Process -Name "LexiaCore5" -ErrorAction SilentlyContinue
          if ($p) {
            Write-Host "Process alive! MainWindowHandle: $($p.MainWindowHandle)"
            Write-Host "MainWindowTitle: $($p.MainWindowTitle)"
            if ($p.MainWindowHandle -ne 0) {
              $sw::ShowWindow($p.MainWindowHandle, 3) | Out-Null
              Start-Sleep -Milliseconds 500
              $fg::SetForegroundWindow($p.MainWindowHandle) | Out-Null
              Start-Sleep -Seconds 3
            }
          } else { Write-Host "Process not found!" }

          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          $bounds = $screen.Bounds
          
          function TakeScreenshot($name) {
            $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save("screenshots\$name")
            $g.Dispose(); $bmp.Dispose()
          }
          
          $p2 = Get-Process -Name "LexiaCore5" -ErrorAction SilentlyContinue
          $winLeft = 0; $winTop = 0
          if ($p2 -and $p2.MainWindowHandle -ne 0) {
            $rect = New-Object RECT
            [WinRect]::GetWindowRect($p2.MainWindowHandle, [ref]$rect) | Out-Null
            $winLeft = $rect.Left
            $winTop = $rect.Top
            Write-Host "App window rect: Left=$($rect.Left) Top=$($rect.Top) Right=$($rect.Right) Bottom=$($rect.Bottom)"
          }

          function ClickAt($relX, $relY, $label) {
            $absX = $winLeft + $relX
            $absY = $winTop + $relY
            Write-Host "  Clicking at screen($absX, $absY) = window-relative($relX, $relY) - $label"
            [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point($absX, $absY)
            Start-Sleep -Milliseconds 500
            $me::mouse_event(0x02, 0, 0, 0, 0)  # left button down
            Start-Sleep -Milliseconds 100
            $me::mouse_event(0x04, 0, 0, 0, 0)  # left button up
            Start-Sleep -Seconds 2
          }

          # Hardware-level keyboard event function (more reliable than SendKeys)
          function PressKey($vk) {
            $ke::keybd_event($vk, 0, 0, [UIntPtr]::Zero)   # key down
            Start-Sleep -Milliseconds 50
            $ke::keybd_event($vk, 0, 2, [UIntPtr]::Zero)   # key up (KEYEVENTF_KEYUP=2)
            Start-Sleep -Milliseconds 200
          }

          TakeScreenshot "01-initial.png"
          Start-Sleep -Seconds 5

          # ============================================================
          # STEP 6: Handle the SetupScreen
          # ============================================================
          
          # Click the Student/Parent button (known working coords)
          Write-Host "=== Clicking Student/Parent button ==="
          ClickAt 666 381 "Student/Parent button"
          TakeScreenshot "02-after-student-parent.png"
          
          Start-Sleep -Seconds 3
          TakeScreenshot "03-teacher-email-screen.png"
          
          # Type teacher email
          Write-Host "=== Entering teacher email ==="
          ClickAt 529 364 "Teacher email field"
          Start-Sleep -Milliseconds 500
          [System.Windows.Forms.SendKeys]::SendWait("teacher@school.edu")
          Start-Sleep -Seconds 1
          TakeScreenshot "04-email-typed.png"
          
          # ============================================================
          # KEY FIX: Click the Next button at CORRECTED coordinates
          # Pixel analysis shows the arrow icon is at (478, 516) not (565, 503)
          # ============================================================
          Write-Host "=== Clicking Next button (corrected coords) ==="
          
          # Try center of the arrow icon
          ClickAt 478 516 "Next arrow center"
          Start-Sleep -Seconds 5
          TakeScreenshot "05-after-next-click.png"
          
          # If that didn''t work, try slightly different positions around the arrow
          Write-Host "=== Scanning for button hit area ==="
          $positions = @(
            @(470, 510, "upper-left"),
            @(490, 520, "lower-right"),
            @(475, 500, "above"),
            @(480, 530, "below"),
            @(465, 515, "left"),
            @(495, 515, "right"),
            @(478, 516, "center-retry")
          )
          foreach ($pos in $positions) {
            ClickAt $pos[0] $pos[1] $pos[2]
            Start-Sleep -Seconds 3
            TakeScreenshot "06-scan-$($pos[2]).png"
          }
          
          # ============================================================
          # Fallback: Hardware-level Enter key
          # ============================================================
          Write-Host "=== Hardware Enter key ==="
          # VK_RETURN = 0x0D = 13
          PressKey 13
          Start-Sleep -Seconds 5
          TakeScreenshot "07-after-hw-enter.png"
          
          # Try TAB + Enter (move to next field then submit)
          Write-Host "=== Hardware TAB + Enter ==="
          # VK_TAB = 0x09
          PressKey 9
          Start-Sleep -Milliseconds 500
          PressKey 13
          Start-Sleep -Seconds 5
          TakeScreenshot "08-after-hw-tab-enter.png"
          
          # Try TAB + SPACE (VK_SPACE = 0x20 = 32)
          Write-Host "=== Hardware TAB + SPACE ==="
          PressKey 9
          Start-Sleep -Milliseconds 500
          PressKey 32
          Start-Sleep -Seconds 5
          TakeScreenshot "09-after-hw-tab-space.png"
          
          # Try double-TAB + Enter (skip past one more element)
          PressKey 9
          Start-Sleep -Milliseconds 300
          PressKey 9
          Start-Sleep -Milliseconds 500
          PressKey 13
          Start-Sleep -Seconds 5
          TakeScreenshot "10-after-doubletab-enter.png"
          
          # ============================================================
          # Fallback: SendMessage WM_LBUTTONDOWN/UP directly to window
          # ============================================================
          Write-Host "=== SendMessage approach ==="
          $hWnd = $p2.MainWindowHandle
          if ($hWnd -ne 0) {
            # WM_LBUTTONDOWN = 0x201, WM_LBUTTONUP = 0x202
            $lParam = [IntPtr]((478) -bor (516 -shl 16))
            [WinRect]::SendMessage($hWnd, 0x201, [IntPtr]::Zero, $lParam) | Out-Null
            Start-Sleep -Milliseconds 100
            [WinRect]::SendMessage($hWnd, 0x202, [IntPtr]::Zero, $lParam) | Out-Null
            Start-Sleep -Seconds 5
            TakeScreenshot "11-after-sendmessage.png"
          }
          
          # ============================================================
          # Check if we got past the email screen
          # ============================================================
          Write-Host "=== Checking current state ==="
          TakeScreenshot "12-current-state.png"
          
          # If a login screen appeared, try entering student credentials
          ClickAt 512 350 "Possible username field"
          Start-Sleep -Milliseconds 500
          [System.Windows.Forms.SendKeys]::SendWait("{END}")
          Start-Sleep -Milliseconds 200
          [System.Windows.Forms.SendKeys]::SendWait("+{HOME}")  # select all
          Start-Sleep -Milliseconds 200
          [System.Windows.Forms.SendKeys]::SendWait("{DELETE}")  # clear field
          Start-Sleep -Milliseconds 200
          [System.Windows.Forms.SendKeys]::SendWait("student")
          Start-Sleep -Milliseconds 500
          PressKey 9
          Start-Sleep -Milliseconds 500
          [System.Windows.Forms.SendKeys]::SendWait("password")
          Start-Sleep -Milliseconds 500
          TakeScreenshot "13-credentials-entered.png"
          PressKey 13
          Start-Sleep -Seconds 10
          TakeScreenshot "14-after-login.png"
          
          # Wait for app to progress
          for ($i = 15; $i -le 22; $i++) {
            Start-Sleep -Seconds 5
            TakeScreenshot ("{0:D2}-progress.png" -f $i)
          }

          # ============================================================
          # STEP 7: Collect all logs
          # ============================================================
          Write-Host "=== Proxy stdout ==="
          if (Test-Path C:\proxy-stdout.txt) { Get-Content C:\proxy-stdout.txt }
          Write-Host "=== PHP stdout ==="
          if (Test-Path C:\php-stdout.txt) { Get-Content C:\php-stdout.txt }
          Write-Host "=== AMF/Proxy Log ==="
          if (Test-Path C:\amf-log.txt) { Get-Content C:\amf-log.txt } else { Write-Host "No proxy log" }
          Write-Host "=== Processes ==="
          Get-Process -Name "python","php","LexiaCore5" -ErrorAction SilentlyContinue | Format-Table Name,Id,MainWindowTitle -AutoSize

          # Find and copy PortalDesktop.log
          Write-Host "=== PortalDesktop.log ==="
          $found = Get-ChildItem -Path $env:APPDATA,$env:LOCALAPPDATA -Filter "PortalDesktop.log" -Recurse -ErrorAction SilentlyContinue
          if ($found) {
            foreach ($f in $found) {
              Write-Host "Found: $($f.FullName)"
              Copy-Item $f.FullName "screenshots\PortalDesktop.log" -Force
            }
            Get-Content $found[0].FullName
          } else { Write-Host "PortalDesktop.log not found" }

          # List all .sol files
          Write-Host "=== All .sol files ==="
          $allSO = Get-ChildItem -Path "$env:APPDATA","$env:LOCALAPPDATA" -Recurse -Filter "*.sol" -ErrorAction SilentlyContinue
          if ($allSO) {
            foreach ($so in $allSO) {
              Write-Host "  $($so.FullName) ($($so.Length) bytes)"
              # Copy all .sol files to artifacts
              $destName = "sol_" + [System.IO.Path]::GetFileName($so.Directory.Name) + "_" + $so.Name
              Copy-Item $so.FullName "screenshots\$destName" -Force
            }
          }

          # Cleanup
          Get-Process -Name "LexiaCore5" -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Job $phpJob -ErrorAction SilentlyContinue
          Stop-Job $proxyJob -ErrorAction SilentlyContinue
          Remove-Job $phpJob -ErrorAction SilentlyContinue
          Remove-Job $proxyJob -ErrorAction SilentlyContinue
          '
          
          $code | Out-File -FilePath "C:\interact.ps1" -Encoding UTF8
          & "C:\interact.ps1"

      - name: Upload AMF logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amf-logs
          path: |
            C:\amf-log.txt
            C:\proxy-stdout.txt
            C:\php-stdout.txt
            C:\PortalDesktop.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload screenshots and app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-test-screenshots
          path: screenshots/
          retention-days: 30
          if-no-files-found: ignore
