name: Mock Server Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Lexia installer
        id: cache-installer
        uses: actions/cache@v4
        with:
          path: lexia-installer.exe
          key: lexia-installer-v1.0

      - name: Download Lexia Core5 installer from release
        if: steps.cache-installer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $apiUrl = "https://api.github.com/repos/aciderix/lexia-core5-portable/releases/assets/508863891"
          $headers = @{ "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}"; "Accept" = "application/octet-stream" }
          Invoke-WebRequest -Uri $apiUrl -OutFile "lexia-installer.exe" -Headers $headers

      - name: Check if already installed
        id: check-install
        shell: pwsh
        run: if (Test-Path "C:\Program Files (x86)\Lexia Core5\LexiaCore5.exe") { echo "installed=true" >> $env:GITHUB_OUTPUT } else { echo "installed=false" >> $env:GITHUB_OUTPUT }

      - name: Install Lexia Core5 silently
        if: steps.check-install.outputs.installed != 'true'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\lexia-installer.exe" -ArgumentList "--mode","unattended","--unattendedmodeui","none" -Wait -PassThru
          Write-Host "Installer exit code: $($proc.ExitCode)"
          Start-Sleep -Seconds 15

      - name: Setup hosts redirect and mock server
        shell: pwsh
        run: |
          Copy-Item "scripts/amf_server_https.py" "C:\amf_server.py"
          
          $hostsFile = "C:\Windows\System32\drivers\etc\hosts"
          $entries = @(
            "127.0.0.1 student.mylexia.com",
            "127.0.0.1 dev10.lexialearning.com",
            "127.0.0.1 qa10.lexialearning.com",
            "127.0.0.1 www.mylexia.com",
            "127.0.0.1 mylexia.com",
            "127.0.0.1 api.lexialearning.com",
            "127.0.0.1 student.lexialearning.com"
          )
          foreach ($entry in $entries) {
            Add-Content -Path $hostsFile -Value $entry
          }
          Write-Host "Hosts file updated"

      - name: Run mock server and app
        shell: pwsh
        run: |
          $code = '
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path "screenshots" | Out-Null

          $fg = Add-Type -MemberDefinition "[DllImport(`"user32.dll`")] public static extern bool SetForegroundWindow(IntPtr h);" -Name FG -Namespace W -PassThru
          $sw = Add-Type -MemberDefinition "[DllImport(`"user32.dll`")] public static extern bool ShowWindow(IntPtr h, int n);" -Name SW -Namespace W -PassThru

          Write-Host "Starting mock HTTPS AMF server..."
          $serverJob = Start-Job -ScriptBlock { python C:\amf_server.py 2>&1 | Out-File C:\amf-stdout.txt -Encoding UTF8 }
          Start-Sleep -Seconds 8

          Write-Host "=== Server job state ==="
          Write-Host "Job status: $($serverJob.State)"
          if (Test-Path C:\amf-stdout.txt) { Get-Content C:\amf-stdout.txt }
          
          Write-Host "=== netstat 443 ==="
          netstat -an | Select-String ":443 "

          Write-Host "Launching LexiaCore5..."
          $exe = "C:\Program Files (x86)\Lexia Core5\LexiaCore5.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host "App PID: $($proc.Id)"
          Start-Sleep -Seconds 20

          $p = Get-Process -Name "LexiaCore5" -ErrorAction SilentlyContinue
          if ($p) {
            Write-Host "Process alive! MainWindowHandle: $($p.MainWindowHandle)"
            Write-Host "MainWindowTitle: $($p.MainWindowTitle)"
            if ($p.MainWindowHandle -ne 0) {
              $sw::ShowWindow($p.MainWindowHandle, 3) | Out-Null
              Start-Sleep -Milliseconds 500
              $fg::SetForegroundWindow($p.MainWindowHandle) | Out-Null
              Start-Sleep -Seconds 3
            }
          } else {
            Write-Host "Process not found!"
          }

          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          $bounds = $screen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("screenshots\01-initial.png")
          $g.Dispose(); $bmp.Dispose()

          for ($i = 2; $i -le 10; $i++) {
            Start-Sleep -Seconds 5
            $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save("screenshots\{0:D2}-delayed.png" -f $i)
            $g.Dispose(); $bmp.Dispose()
          }

          # Results
          Write-Host "=== AMF Server stdout ==="
          if (Test-Path C:\amf-stdout.txt) { Get-Content C:\amf-stdout.txt }
          Write-Host "=== AMF Log ==="
          if (Test-Path C:\amf-log.txt) { Get-Content C:\amf-log.txt } else { Write-Host "No AMF log" }
          Write-Host "=== netstat ==="
          netstat -an | Select-String ":443 "
          Write-Host "=== Processes ==="
          Get-Process -Name "python","LexiaCore5" -ErrorAction SilentlyContinue | Format-Table Name,Id,MainWindowTitle -AutoSize

          # Find and copy PortalDesktop.log (AIR app log)
          Write-Host "=== Searching for PortalDesktop.log ==="
          $logPaths = @(
            "$env:APPDATA\LexiaCore5\PortalDesktop.log",
            "$env:LOCALAPPDATA\LexiaCore5\PortalDesktop.log",
            "$env:APPDATA\LexiaCore5\Adobe\AIR\ELS\PortalDesktop.log"
          )
          # Also search recursively in AppData
          $found = Get-ChildItem -Path $env:APPDATA,$env:LOCALAPPDATA -Filter "PortalDesktop.log" -Recurse -ErrorAction SilentlyContinue
          if ($found) {
            foreach ($f in $found) {
              Write-Host "Found log at: $($f.FullName)"
              Copy-Item $f.FullName "C:\PortalDesktop.log" -Force
              # Also copy to screenshots dir for upload
              Copy-Item $f.FullName "screenshots\PortalDesktop.log" -Force
            }
          } else {
            Write-Host "PortalDesktop.log not found, searching broader..."
            $found2 = Get-ChildItem -Path "C:\Users" -Filter "PortalDesktop.log" -Recurse -ErrorAction SilentlyContinue
            if ($found2) {
              foreach ($f in $found2) {
                Write-Host "Found log at: $($f.FullName)"
                Copy-Item $f.FullName "C:\PortalDesktop.log" -Force
                Copy-Item $f.FullName "screenshots\PortalDesktop.log" -Force
              }
            } else {
              Write-Host "PortalDesktop.log NOT FOUND anywhere"
            }
          }

          # Also look for any AIR debug logs
          $airLogs = Get-ChildItem -Path $env:APPDATA -Filter "*.log" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "lexia|Lexia" }
          if ($airLogs) {
            foreach ($f in $airLogs) {
              Write-Host "AIR log: $($f.FullName)"
              Copy-Item $f.FullName "screenshots\$(Split-Path $f.FullName -Leaf)" -Force
            }
          }

          # Cleanup
          Get-Process -Name "LexiaCore5" -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Job $serverJob -ErrorAction SilentlyContinue
          Remove-Job $serverJob -ErrorAction SilentlyContinue
          '
          
          $code | Out-File -FilePath "C:\interact.ps1" -Encoding UTF8
          & "C:\interact.ps1"

      - name: Upload AMF logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amf-logs
          path: |
            C:\amf-log.txt
            C:\amf-stdout.txt
            C:\PortalDesktop.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload screenshots and app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-test-screenshots
          path: screenshots/
          retention-days: 30
          if-no-files-found: ignore
