name: Mock Server Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Lexia installer
        id: cache-installer
        uses: actions/cache@v4
        with:
          path: lexia-installer.exe
          key: lexia-installer-v1.0

      - name: Download Lexia Core5 installer from release
        if: steps.cache-installer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $apiUrl = "https://api.github.com/repos/aciderix/lexia-core5-portable/releases/assets/508863891"
          $headers = @{
            "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}"
            "Accept" = "application/octet-stream"
          }
          Invoke-WebRequest -Uri $apiUrl -OutFile "lexia-installer.exe" -Headers $headers

      - name: Check if already installed
        id: check-install
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\Lexia Core5\LexiaCore5.exe") {
            echo "installed=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "installed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Install Lexia Core5 silently
        if: steps.check-install.outputs.installed != 'true'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\lexia-installer.exe" -ArgumentList "--mode","unattended","--unattendedmodeui","none" -Wait -PassThru
          Write-Host "Installer exit code: $($proc.ExitCode)"
          Start-Sleep -Seconds 15

      - name: Download patched SWF
        shell: pwsh
        run: |
          $url = "https://github.com/aciderix/lexia-core5-portable/releases/download/v1.0/PortalDesktop-patched.swf"
          Invoke-WebRequest -Uri $url -OutFile "PortalDesktop-patched.swf"
          Write-Host "Downloaded patched SWF"

      - name: Replace SWF with patched version
        shell: pwsh
        run: |
          $swfPath = "C:\Program Files (x86)\Lexia Core5\PortalDesktop.swf"
          Copy-Item "PortalDesktop-patched.swf" $swfPath -Force
          Write-Host "Replaced SWF with patched version (HTTP localhost:8080)"

      - name: Copy AMF server script
        shell: pwsh
        run: |
          Copy-Item "scripts/amf_server.py" "C:\amf_server.py"
          Write-Host "AMF server script copied"

      - name: Start mock AMF server (HTTP port 8080)
        shell: pwsh
        run: |
          Start-Process -FilePath "python" -ArgumentList "C:\amf_server.py" `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput "C:\amf-stdout.txt" `
            -RedirectStandardError "C:\amf-stderr.txt"
          Start-Sleep -Seconds 3
          Write-Host "=== STDOUT ==="
          if (Test-Path C:\amf-stdout.txt) { Get-Content C:\amf-stdout.txt }
          Write-Host "=== STDERR ==="
          if (Test-Path C:\amf-stderr.txt) { Get-Content C:\amf-stderr.txt }

      - name: Verify mock server is listening
        shell: pwsh
        run: |
          $conn = Get-NetTCPConnection -LocalPort 8080 -ErrorAction SilentlyContinue
          if ($conn) {
            Write-Host "Mock server is listening on port 8080"
            $conn | Format-Table -AutoSize
          } else {
            Write-Host "WARNING: Mock server not listening on port 8080!"
          }

      - name: Launch app and screenshot
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          
          $exe = "C:\Program Files (x86)\Lexia Core5\LexiaCore5.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host "Launched app PID: $($proc.Id)"
          
          # Wait for app to load and try to connect
          Start-Sleep -Seconds 30
          
          # Take multiple screenshots
          New-Item -ItemType Directory -Force -Path "screenshots" | Out-Null
          
          for ($i = 1; $i -le 3; $i++) {
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen
            $bounds = $screen.Bounds
            $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bmp)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save("screenshots\lexia-mock-$i.png")
            $graphics.Dispose(); $bmp.Dispose()
            Write-Host "Screenshot $i saved"
            Start-Sleep -Seconds 10
          }
          
          # Check network connections
          Write-Host "=== Network connections ==="
          Get-NetTCPConnection -OwningProcess $proc.Id -ErrorAction SilentlyContinue | Format-Table -AutoSize
          
          # Also check all connections to port 8080
          Write-Host "=== Connections to port 8080 ==="
          Get-NetTCPConnection -RemotePort 8080 -ErrorAction SilentlyContinue | Format-Table -AutoSize
          
          # Check AMF server logs
          Write-Host "=== AMF Server stdout ==="
          if (Test-Path C:\amf-stdout.txt) { Get-Content C:\amf-stdout.txt }
          Write-Host "=== AMF Server stderr ==="
          if (Test-Path C:\amf-stderr.txt) { Get-Content C:\amf-stderr.txt }
          
          $proc | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      - name: Upload AMF logs
        uses: actions/upload-artifact@v4
        with:
          name: amf-logs
          path: |
            C:\amf-log.txt
            C:\amf-stdout.txt
            C:\amf-stderr.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mock-test-screenshots
          path: screenshots/
          retention-days: 30
          if-no-files-found: ignore
