class AMFHandler(BaseHTTPRequestHandler):
    def log_message(self, format, *args):
        print(f"[AMF] {args[0]}")
    
    def do_POST(self):
        content_length = int(self.headers.get('Content-Length', 0))
        body = self.rfile.read(content_length)
        
        print(f"\n=== AMF Request ({content_length} bytes) ===")
        print(f"Path: {self.path}")
        print(f"Hex (first 100): {body[:100].hex()}")
        
        method = "unknown"
        try:
            reader = AMFReader(body)
            parsed = reader.parse()
            print(f"Parsed: {json.dumps(parsed, default=str, indent=2)}")
            
            if parsed['bodies']:
                target = parsed['bodies'][0]['target_uri']
                # Target format: "AMFClient.handshake" or similar
                parts = target.split('.')
                if len(parts) >= 2:
                    method = parts[-1]
                else:
                    method = target
                print(f"\nMethod: {method}")
        except Exception as e:
            print(f"Parse error: {e}")
            traceback.print_exc()
        
        # Build mock response
        mock = get_mock_response(method)
        writer = AMFWriter()
        
        # The response URI should be /1/onResult
        response_uri = "/1/onResult"
        response_data = writer.build_response(target, response_uri, mock)
        
        print(f"\n=== AMF Response ({len(response_data)} bytes) ===")
        print(f"Hex (first 100): {response_data[:100].hex()}")
        print(f"Mock data: {json.dumps(mock, default=str, indent=2)}")
        
        self.send_response(200)
        self.send_header('Content-Type', 'application/x-amf')
        self.send_header('Content-Length', len(response_data))
        self.end_headers()
        self.wfile.write(response_data)
        
        # Also save to log file
        with open('C:\\amf-log.txt', 'a') as f:
            f.write(f"\n=== {method} ===\n")
            f.write(f"Request hex: {body.hex()}\n")
            f.write(f"Response hex: {response_data.hex()}\n")
            f.write(f"Mock: {json.dumps(mock, default=str)}\n")
    
    def do_GET(self):
        self.send_response(200)
        self.send_header('Content-Type', 'text/html')
        self.end_headers()
        self.wfile.write(b"AMF Mock Server Running")

if __name__ == '__main__':
    port = int(os.environ.get('AMF_PORT', '8443'))
    
    # Create SSL context
    ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
    ctx.load_cert_chain('C:\\cert.pem', 'C:\\key.pem')
    
    server = HTTPServer(('0.0.0.0', port), AMFHandler)
    server.socket = ctx.wrap_socket(server.socket, server_side=True)
    
    print(f"AMF Mock Server running on https://0.0.0.0:{port}")
    print(f"Waiting for requests...")
    
    try:
        server.serve_forever()
    except KeyboardInterrupt:
        print("Server stopped")
'@
          
          $serverCode | Out-File -FilePath "C:\amf_server.py" -Encoding UTF8
          Write-Host "AMF server script created"

      - name: Create self-signed SSL certificate
        shell: pwsh
        run: |
          # Create self-signed cert for student.mylexia.com
          $cert = New-SelfSignedCertificate -DnsName "student.mylexia.com", "*.mylexia.com" -CertStoreLocation "Cert:\LocalMachine\My" -KeyUsage DigitalSignature,KeyEncipherment -KeyAlgorithm RSA -KeyLength 2048 -NotAfter (Get-Date).AddYears(1)
          
          # Export cert and key for Python
          $certPath = "C:\cert.pfx"
          $certPassword = "test123"
          Export-PfxCertificate -Cert $cert -FilePath $certPath -Password (ConvertTo-SecureString -String $certPassword -AsPlainText -Force)
          
          # Convert to PEM using openssl
          openssl pkcs12 -in $certPath -nocerts -nodes -out C:\key.pem -passin pass:$certPassword 2>&1
          openssl pkcs12 -in $certPath -nokeys -out C:\cert.pem -passin pass:$certPassword 2>&1
          
          # Also export the CA cert to trust store
          $caCert = Export-Certificate -Cert $cert -FilePath "C:\lexia-ca.cer"
          Import-Certificate -FilePath "C:\lexia-ca.cer" -CertStoreLocation "Cert:\LocalMachine\Root"
          
          Write-Host "SSL certificate created and installed"
          Get-ChildItem "Cert:\LocalMachine\My" | Where-Object { $_.Subject -like "*mylexia*" } | Format-List

      - name: Redirect hosts file
        shell: pwsh
        run: |
          $hostsPath = "C:\Windows\System32\drivers\etc\hosts"
          Add-Content $hostsPath "`n127.0.0.1 student.mylexia.com"
          Add-Content $hostsPath "127.0.0.1 www.mylexia.com"
          Write-Host "Hosts file updated"
          Get-Content $hostsPath | Select-Object -Last 5
          
          # Flush DNS
          ipconfig /flushdns

      - name: Start mock AMF server
        shell: pwsh
        run: |
          # Start the AMF server in background
          $proc = Start-Process -FilePath "python" -ArgumentList "C:\amf_server.py" -PassThru -NoNewWindow -RedirectStandardOutput "C:\amf-stdout.txt" -RedirectStandardError "C:\amf-stderr.txt"
          Write-Host "AMF server started, PID: $($proc.Id)"
          Start-Sleep -Seconds 3
          
          # Check if it's running
          if (Test-Path "C:\amf-stdout.txt") {
            Get-Content "C:\amf-stdout.txt"
          }
          if (Test-Path "C:\amf-stderr.txt") {
            Write-Host "Errors:"
            Get-Content "C:\amf-stderr.txt"
          }

      - name: Launch app and screenshot
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          
          $exe = "C:\Program Files (x86)\Lexia Core5\LexiaCore5.exe"
          Write-Host "Launching: $exe"
          
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host "PID: $($proc.Id)"
          
          # Wait for app to load
          Start-Sleep -Seconds 30
          
          # Take screenshot
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          $bounds = $screen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $graphics = [System.Drawing.Graphics]::FromImage($bmp)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          
          New-Item -ItemType Directory -Force -Path "screenshots" | Out-Null
          $bmp.Save("screenshots/lexia-mock-test.png")
          $graphics.Dispose()
          $bmp.Dispose()
          Write-Host "Screenshot saved"
          
          # Check network connections
          Write-Host "`n=== Network connections ==="
          Get-NetTCPConnection -OwningProcess $proc.Id -ErrorAction SilentlyContinue | Format-Table -AutoSize
          
          # Kill app
          $proc | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      - name: Upload AMF logs
        uses: actions/upload-artifact@v4
        with:
          name: amf-logs
          path: |
            C:\amf-log.txt
            C:\amf-stdout.txt
            C:\amf-stderr.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mock-test-screenshots
          path: screenshots/
          retention-days: 30
          if-no-files-found: ignore
