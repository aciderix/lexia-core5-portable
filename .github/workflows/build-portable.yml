name: Build Lexia Core5 Portable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Lexia installer
        id: cache-installer
        uses: actions/cache@v4
        with:
          path: lexia-installer.exe
          key: lexia-installer-v1.0

      - name: Download Lexia Core5 installer from release
        if: steps.cache-installer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $apiUrl = "https://api.github.com/repos/aciderix/lexia-core5-portable/releases/assets/508863891"
          $headers = @{
            "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}"
            "Accept" = "application/octet-stream"
          }
          Write-Host "Downloading installer..."
          Invoke-WebRequest -Uri $apiUrl -OutFile "lexia-installer.exe" -Headers $headers
          $size = (Get-Item "lexia-installer.exe").Length
          Write-Host "Downloaded: $size bytes"

      - name: Check if already installed
        id: check-install
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\Lexia Core5\LexiaCore5.exe") {
            Write-Host "Already installed, skipping installation"
            echo "installed=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "installed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Install Lexia Core5 silently
        if: steps.check-install.outputs.installed != 'true'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\lexia-installer.exe" -ArgumentList "--mode","unattended","--unattendedmodeui","none" -Wait -PassThru
          Write-Host "Installer exit code: $($proc.ExitCode)"
          Start-Sleep -Seconds 15

      - name: Search config files for server URLs
        shell: pwsh
        run: |
          $installDir = "C:\Program Files (x86)\Lexia Core5"
          Write-Host "=== Searching for config files ==="
          
          # Find all config-like files
          $configFiles = Get-ChildItem $installDir -Recurse -Include *.xml,*.json,*.ini,*.cfg,*.config,*.properties,*.txt,*.swf -ErrorAction SilentlyContinue
          
          foreach ($f in $configFiles) {
            $relPath = $f.FullName.Replace($installDir, "")
            Write-Host "`n--- $relPath ($($f.Length) bytes) ---"
            
            # For text files, show content
            if ($f.Length -lt 50000) {
              $content = Get-Content $f.FullName -Raw -ErrorAction SilentlyContinue
              if ($content) {
                # Look for URLs, server names, domains
                $urls = [regex]::Matches($content, '(https?://[^\s<>"''`]+|[\w-]+\.(com|net|org|io|co)[^\s<>"''`]*)')
                if ($urls.Count -gt 0) {
                  Write-Host "  URLs found:"
                  foreach ($u in $urls) { Write-Host "    $($u.Value)" }
                }
                
                # Show first 500 chars of text configs
                if ($f.Extension -in @('.xml','.json','.ini','.cfg','.config','.properties','.txt')) {
                  Write-Host "  Content preview:"
                  Write-Host $content.Substring(0, [Math]::Min(500, $content.Length))
                }
              }
            } else {
              Write-Host "  (binary, $($f.Length) bytes)"
            }
          }
          
          # Also search for domain names in binary files
          Write-Host "`n=== Searching binaries for server URLs ==="
          $binaries = Get-ChildItem $installDir -Recurse -Include *.exe,*.dll,*.swf -ErrorAction SilentlyContinue
          foreach ($b in $binaries) {
            $bytes = [System.IO.File]::ReadAllBytes($b.FullName)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            $urls = [regex]::Matches($text, '(https?://[^\s\x00-\x1f"''<>]+)')
            $domains = [regex]::Matches($text, '([\w-]+\.lexia[^\s\x00-\x1f"''<>]*)')
            $allMatches = $urls + $domains | Select-Object -Unique -Property Value
            if ($allMatches) {
              Write-Host "`n  $($b.Name):"
              foreach ($m in $allMatches | Select-Object -First 20) {
                Write-Host "    $($m.Value)"
              }
            }
          }

      - name: Start network capture
        shell: pwsh
        run: |
          # Start packet capture with pktmon (built into Windows 10+)
          Write-Host "Starting packet capture..."
          pktmon start --capture --comp nics -f C:\trace.etl
          Write-Host "Packet capture started"
          
          # Also start a DNS capture
          netsh dns show tracing 2>$null
          
          # Clear DNS cache
          ipconfig /flushdns

      - name: Run app and capture network traffic
        shell: pwsh
        run: |
          $exe = "C:\Program Files (x86)\Lexia Core5\LexiaCore5.exe"
          Write-Host "Launching: $exe"
          
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host "Process started, PID: $($proc.Id)"
          
          # Monitor network connections every 2 seconds for 30 seconds
          Write-Host "`n=== Network connections log ==="
          for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 2
            Write-Host "`n--- T+$($i*2)s ---"
            
            # Active TCP connections from the app
            $conns = Get-NetTCPConnection -OwningProcess $proc.Id -ErrorAction SilentlyContinue
            foreach ($c in $conns) {
              $remote = Get-NetIPConfiguration | Where-Object { $_.IPv4Address.IPAddress -ne $c.LocalAddress }
              Write-Host "  TCP: $($c.LocalAddress):$($c.LocalPort) -> $($c.RemoteAddress):$($c.RemotePort) [$($c.State)]"
            }
            
            # Also check all ESTABLISHED connections
            $established = Get-NetTCPConnection -State Established -ErrorAction SilentlyContinue | Where-Object { $_.RemoteAddress -ne '127.0.0.1' -and $_.RemoteAddress -ne '::1' }
            foreach ($c in $established) {
              Write-Host "  ESTABLISHED: $($c.LocalAddress):$($c.LocalPort) -> $($c.RemoteAddress):$($c.RemotePort)"
            }
          }
          
          # Check DNS cache
          Write-Host "`n=== DNS Cache (looking for lexia-related entries) ==="
          $dns = ipconfig /displaydns 2>&1
          $dnsLines = $dns -split "`n" | Where-Object { $_ -match 'lexia|core5|learning|literacy' -or $_ -match 'Record Name' -or $_ -match 'A \(Host\) Record' }
          foreach ($line in $dnsLines) {
            Write-Host $line.Trim()
          }
          
          # Get full DNS cache to file
          ipconfig /displaydns > C:\dns-cache.txt 2>&1
          
          # Check hosts file
          Write-Host "`n=== Hosts file ==="
          Get-Content C:\Windows\System32\drivers\etc\hosts
          
          # Kill the app
          Write-Host "`nStopping app..."
          $proc | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      - name: Stop network capture
        shell: pwsh
        run: |
          Write-Host "Stopping packet capture..."
          pktmon stop
          Write-Host "Capture stopped"
          
          # Convert to readable format
          Write-Host "Converting capture..."
          pktmon format C:\trace.etl -o C:\trace.txt 2>&1 | Select-Object -First 5
          pktmon pcapng C:\trace.etl -o C:\trace.pcapng 2>&1 | Select-Object -First 5
          
          # Check file sizes
          if (Test-Path C:\trace.etl) { Write-Host "ETL: $((Get-Item C:\trace.etl).Length) bytes" }
          if (Test-Path C:\trace.txt) { Write-Host "TXT: $((Get-Item C:\trace.txt).Length) bytes" }
          if (Test-Path C:\trace.pcapng) { Write-Host "PCAPNG: $((Get-Item C:\trace.pcapng).Length) bytes" }

      - name: Extract all network-related info from logs
        shell: pwsh
        run: |
          $outFile = "network-analysis.txt"
          @"
          ============================================
          LEXIA CORE5 NETWORK ANALYSIS
          $(Get-Date)
          ============================================

          === INSTALLED FILES LISTING ===
          "@ | Out-File $outFile -Encoding UTF8
          
          $installDir = "C:\Program Files (x86)\Lexia Core5"
          Get-ChildItem $installDir -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Add-Content $outFile
          
          @"
          
          === ALL CONFIG FILES CONTENT ===
          "@ | Add-Content $outFile
          
          $configs = Get-ChildItem $installDir -Recurse -Include *.xml,*.json,*.ini,*.cfg,*.config,*.properties -ErrorAction SilentlyContinue
          foreach ($f in $configs) {
            "`n--- $($f.FullName) ---" | Add-Content $outFile
            Get-Content $f.FullName -Raw | Add-Content $outFile
          }
          
          @"
          
          === DNS CACHE ===
          "@ | Add-Content $outFile
          if (Test-Path C:\dns-cache.txt) { Get-Content C:\dns-cache.txt | Add-Content $outFile }
          
          # Show first 200 lines of trace
          @"
          
          === PACKET CAPTURE (first 200 lines) ===
          "@ | Add-Content $outFile
          if (Test-Path C:\trace.txt) { Get-Content C:\trace.txt -TotalCount 200 | Add-Content $outFile }
          
          Write-Host "Network analysis saved"

      - name: Upload network capture (pcapng)
        uses: actions/upload-artifact@v4
        with:
          name: network-capture
          path: |
            C:\trace.pcapng
            C:\trace.txt
            C:\trace.etl
            C:\dns-cache.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload network analysis
        uses: actions/upload-artifact@v4
        with:
          name: network-analysis
          path: network-analysis.txt
          retention-days: 30

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: lexia-core5-portable
          path: portable/
          retention-days: 30

      - name: Take screenshot
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $exe = "C:\Program Files (x86)\Lexia Core5\LexiaCore5.exe"
          if (Test-Path $exe) {
            $proc = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 20

            $screen = [System.Windows.Forms.Screen]::PrimaryScreen
            $bounds = $screen.Bounds
            $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bmp)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)

            New-Item -ItemType Directory -Force -Path "screenshots" | Out-Null
            $bmp.Save("screenshots/lexia-screenshot.png")
            $graphics.Dispose()
            $bmp.Dispose()
            Write-Host "Screenshot saved"
            $proc | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: lexia-screenshots
          path: screenshots/
          retention-days: 30
          if-no-files-found: ignore
